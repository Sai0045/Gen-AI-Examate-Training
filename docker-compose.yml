services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8502
    ports:
      - "8502:8502"
    environment:
      TEEKATIMER_API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - api
