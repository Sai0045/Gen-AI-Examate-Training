                if (document.getElementById('root')) return;

                fetch('/cms/wp-json/custom/chatbot/settings')

                    if (!res.ok) {
                      throw new Error('Chatbot API returned HTTP ' + res.status);
                    }
                    return res.json();
                  })

                      if (
                        data.chatbot_css_url &&
                        !document.querySelector('link[href="' + data.chatbot_css_url + '"]')

                        link.href = data.chatbot_css_url;
                        document.head.appendChild(link);
                      }

                      if (data.chatbot_script_url) {
                        var rootDiv = document.createElement('div');
                        rootDiv.id = 'root';
                        document.body.appendChild(rootDiv);

                        var script = document.createElement('script');
                        script.src = data.chatbot_script_url;
                        script.async = true;
                        document.body.appendChild(script);
                      }
                    }
                  })
                  .catch(function(err) {
                    console.error('Chatbot client fallback error:', err.message);
                  });
              })();
